name: Create 20 HCP orgs

on:
  push:
    branches: [main]
    paths: ["org-factory/**", ".github/workflows/create-orgs.yml"]
  pull_request:
    paths: ["org-factory/**", ".github/workflows/create-orgs.yml"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Set true to actually create the orgs (default is plan-only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  orgs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: org-factory
    steps:
      - uses: actions/checkout@v4

      # Writes ~/.terraformrc CLI credentials: `terraform init` with a cloud{}
      # backend ignores the TFE_TOKEN env var and only reads CLI credentials.
      # (TFE_TOKEN env below is still needed — the tfe PROVIDER uses it.)
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          cli_config_credentials_token: ${{ secrets.TFE_TOKEN }}

      - name: Terraform fmt check
        run: terraform fmt -check -diff

      - name: Terraform init
        # cloud backend reads/writes state in HCP, so init authenticates too.
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      # terraform.tfvars is gitignored, so provide it in CI:
      # if secret ORG_TFVARS exists use it, else fall back to the
      # committed example (placeholder names/emails — plan-only safe).
      # NOTE: secrets.* cannot be used in `if:` — read it via env instead.
      - name: Provide tfvars (secret or example fallback)
        env:
          ORG_TFVARS: ${{ secrets.ORG_TFVARS }}
        run: |
          if [ -n "$ORG_TFVARS" ]; then
            printf '%s' "$ORG_TFVARS" > terraform.tfvars
            echo "using ORG_TFVARS secret"
          else
            cp terraform.tfvars.example terraform.tfvars
            echo "using terraform.tfvars.example fallback"
          fi

      - name: Terraform plan
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (manual gate)
        if: ${{ github.event.inputs.apply == 'true' }}
        env:
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: org-factory-state
          path: |
            org-factory/terraform.tfstate
            org-factory/terraform.tfstate.backup
            org-factory/tfplan
          if-no-files-found: warn
